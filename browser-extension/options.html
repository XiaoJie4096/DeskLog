<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>日迹 · 网页统计</title><link rel="stylesheet" href="options.css"></head><body><main><div class="eyebrow">RIJI / BROWSER</div><h1>把网页，放回时间里。</h1><p>将当前前台网页的域名发给本机日迹，标题按日迹设置附带。不传完整网址、查询参数或页面正文，隐私窗口不采集。</p><label>连接环境<select id="profile"><option value="production">正式版</option><option value="development">开发版</option></select></label><p id="extension-id"></p><button id="reconnect" type="button">重新连接</button><p id="status" role="status">正在读取连接状态…</p><p>日迹当前默认开启网页标题记录，可在设置中关闭。匹配归属规则的网站独立计时，其余时间计入浏览器，不重复累计。</p></main><script src="options.js"></script></body></html>
