<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>日迹 · 网页统计</title><link rel="stylesheet" href="options.css"></head>
<body><main>
  <div class="eyebrow">RIJI / BROWSER</div>
  <h1>把网页，放回时间里。</h1>
  <p>扩展将你正在使用的网站名称交给本机日迹，用于统计网站使用时间。网页标题是否附带，由日迹的“记录网页标题”设置决定。不传完整网址或网页正文，不记录隐私窗口。</p>
  <label>连接环境<select id="profile"><option value="production">正式版</option><option value="development">开发版</option></select></label>
  <p id="extension-id"></p><button id="reconnect" type="button">重新连接</button><p id="status" role="status">正在读取连接状态…</p>
  <p>日迹默认开启网页标题记录，可在设置中关闭。匹配归属规则的网站独立计时，其余时间计入浏览器，不重复累计。</p>
  <p>启用日迹的 AI 功能后，相关记录（可能包括网页标题）还可能发送给你配置的 AI 服务。<a href="privacy.html">查看隐私说明</a></p>
</main><script src="options.js"></script></body>
</html>
